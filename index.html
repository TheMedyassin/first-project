<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7f1">
<meta name="description" content="جدول يومي عربي بألوان باستيل، قابل للتعديل والتنزيل كصورة.">
<title>جدولي اليومي ♥</title>
<style>
:root{--paper:#fff8f2;--ink:#292126;--muted:#76646a;--pink:#efc6d0;--border:#cbb6ad;--rose:#f6dce1;--blue:#e2eef9;--green:#e6efe1;--lav:#eee2f5;--sand:#f9ecd9;--mint:#e1f0ed;}
*{box-sizing:border-box}
html{background:var(--paper);color:var(--ink);font-family:Tahoma,Arial,"Noto Naskh Arabic",sans-serif}
body{margin:0;background:var(--paper);}
button,input,textarea{font:inherit}
.toolbar-wrap{position:sticky;top:0;z-index:20;padding:10px 14px;background:rgba(255,248,242,.95);backdrop-filter:blur(12px);border-bottom:1px solid #ead8d3}
.toolbar{max-width:1200px;margin:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.brand{font-size:15px;font-weight:800;margin-inline-end:auto;color:#67474e;display:flex;align-items:center;gap:7px}
.tool-button{border:1px solid #d3afb7;background:#f5dce2;color:#432d34;border-radius:12px;padding:10px 14px;font-weight:700;font-size:13px;cursor:pointer;min-height:42px;box-shadow:0 2px 0 rgba(110,67,76,.06)}
.tool-button.primary{background:#6e4954;color:#fff9f5;border-color:#6e4954}
.tool-button:active{transform:translateY(1px)}
.save-state{font-size:12px;color:#806f72;min-width:90px}
.helper{max-width:1200px;margin:10px auto 12px;padding:0 14px;color:#806f72;font-size:12px;line-height:1.7}
#poster-wrap{padding:0 12px 22px;}
.poster{direction:rtl;max-width:1200px;width:100%;min-height:1280px;margin:0 auto;padding:0 0 12px;background:var(--paper);overflow:hidden;border-radius:5px;box-shadow:0 8px 38px rgba(113,81,72,.09);}
.hero{direction:ltr;height:150px;display:grid;grid-template-columns:1fr 2fr 1fr;gap:12px;align-items:center;padding:9px 24px 5px;position:relative}
.hero-note{direction:rtl;font-size:19px;line-height:1.65;text-align:center;font-weight:600;color:#382b2f;max-width:250px;margin:auto}
.hero-note .heart{color:#84545c;font-size:21px}
.hero-title-wrap{direction:rtl;text-align:center;min-width:0}
.hero-title{display:inline-block;background:#f1cbd3;border-radius:50px 40px 44px 38px;padding:3px 35px 9px;transform:rotate(-.4deg);max-width:100%;}
.hero-title .field{font-size:48px;font-weight:900;text-align:center;line-height:1.3;min-width:0}
.hero-subtitle{font-size:20px;margin-top:10px;color:#5b454b;font-weight:600}
.hero-quote{direction:rtl;font-size:21px;line-height:1.55;text-align:center;color:#5b4449;position:relative;padding:8px 3px}
.doodle{display:block;font-size:42px;line-height:1.12;margin-top:2px;filter:saturate(.8)}
.field{display:block;width:100%;min-width:0;border:1px solid transparent;border-radius:5px;background:transparent;color:inherit;padding:0;outline:none;line-height:1.45;text-align:right;direction:rtl;font-family:inherit;box-shadow:none;}
.field:focus{border-color:#b98793;background:rgba(255,255,255,.5);box-shadow:0 0 0 2px rgba(214,164,177,.18);}
.field-display{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1em;cursor:default;}
.ltr{direction:ltr;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.poster-grid{direction:ltr;display:grid;grid-template-columns:minmax(0,2.48fr) minmax(300px,1fr);gap:14px;padding:0 19px;align-items:start;}
.schedule-header,.schedule-row{display:grid;grid-template-columns:1.15fr 1fr .56fr;grid-template-areas:"details activity time";gap:7px;direction:ltr;}
.schedule-header{margin-bottom:7px;}
.head-cell{background:#eac5ce;border:1px solid #e1c1c7;border-radius:12px;text-align:center;font-size:20px;font-weight:800;padding:8px 5px;direction:rtl;}
.head-cell .field{text-align:center;font-size:20px;font-weight:800;}
.schedule-list{display:flex;flex-direction:column;gap:5px;}
.schedule-row{align-items:stretch;min-height:49px;}
.cell{border:1px solid rgba(177,145,140,.37);border-radius:12px;padding:6px 9px;display:flex;align-items:center;direction:rtl;min-width:0;background:var(--rowbg,#f8e7e8);}
.details-cell{grid-area:details;}
.activity-cell{grid-area:activity;gap:7px;font-size:18px;font-weight:700;}
.time-cell{grid-area:time;justify-content:center;font-size:17px;}
.details-cell .field{font-size:16px;line-height:1.4;min-height:34px;resize:none;overflow:hidden;}
.activity-cell .field{font-size:18px;font-weight:700;}
.activity-icon{font-size:26px;line-height:1;flex:0 0 auto;}
.time-cell .field{font-size:17px;text-align:center;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap;}
.sidebar{direction:rtl;display:flex;flex-direction:column;gap:11px;min-width:0;}
.side-card{background:rgba(255,252,248,.76);border:1.5px solid #bba79c;border-radius:17px;padding:12px 13px 11px;min-width:0;}
.side-title{display:flex;align-items:center;justify-content:center;gap:7px;font-size:23px;font-weight:900;margin:0 0 9px;text-align:center;line-height:1.25;}
.side-title .mini-icon{font-size:27px;line-height:1}
.prayer-list{display:flex;flex-direction:column;gap:4px;}
.prayer-line{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:7px;align-items:center;background:#fbf0e9;border-radius:11px;padding:4px 7px;direction:ltr;min-height:34px;}
.prayer-name{display:flex;flex-direction:row;align-items:center;gap:5px;direction:rtl;font-weight:700;font-size:16px;min-width:0;}
.prayer-name .field{font-size:16px;font-weight:700;}
.prayer-name .activity-icon{font-size:22px}
.prayer-time{font-size:15px;text-align:center;direction:ltr;}
.prayer-note{text-align:center;margin:7px 0 0;font-size:13px;font-weight:600;color:#5f5050;line-height:1.5}
.feature-note{background:#fbf0e9;border-radius:12px;padding:7px 9px;text-align:center;font-weight:700;font-size:15px;line-height:1.6;margin-bottom:7px;}
.check-list{display:flex;flex-direction:column;gap:5px;padding:0 2px;}
.checkline{display:flex;align-items:flex-start;gap:6px;direction:rtl;min-width:0;line-height:1.35;font-size:15px;}
.checkline input[type=checkbox]{appearance:none;width:16px;height:16px;border:1.6px solid #95877f;border-radius:3px;background:#fffaf5;flex:0 0 16px;margin:2px 0 0;display:grid;place-items:center;cursor:pointer;}
.checkline input[type=checkbox]:checked{background:#d5e6d2;border-color:#7f9677;}
.checkline input[type=checkbox]:checked::after{content:'✓';font-size:13px;color:#465e43;line-height:1;font-weight:900;}
.checkline .field{font-size:15px;flex:1;width:auto;min-height:20px;}
.checkline.done .field{color:#8e7e7c;}
.goals-card .checkline{font-size:14px;gap:6px;margin-bottom:1px}
.goals-card .checkline .field{font-size:14px;}
.footer{display:flex;align-items:center;justify-content:space-around;gap:10px;margin:9px 19px 0;padding:8px 10px;border-radius:15px;background:#f2ccd3;color:#674c52;font-weight:700;text-align:center;font-size:16px;line-height:1.4;}
.footer-item{flex:1;min-width:0}
.footer-item .field{text-align:center;font-size:16px;font-weight:700;}

/* Keep one consistent desktop-style planner sheet on every screen size.
   Scale the complete 1200px layout to the available width instead of reflowing cards. */
#poster-wrap{display:flex;justify-content:center;overflow:hidden;padding:0 0 22px;}
.poster{width:1200px!important;max-width:none!important;flex:0 0 1200px;transform:scale(var(--poster-scale,1));transform-origin:top center;margin-bottom:calc((var(--poster-scale,1) - 1)*1280px);}
.details-cell{position:relative;}
.details-cell .field{padding-left:58px;}
.row-controls{position:absolute;left:4px;top:50%;transform:translateY(-50%);display:flex;gap:3px;z-index:2;direction:ltr;}
.row-move{width:24px;height:25px;padding:0;border:1px solid #c8a8af;border-radius:7px;background:#fff8f2;color:#65454e;font-size:15px;line-height:1;cursor:pointer;box-shadow:0 1px 2px rgba(80,50,55,.08);}
.row-move:disabled{opacity:.28;cursor:default;}
.emoji-input{display:inline-block;width:2.05em;min-width:2.05em;max-width:2.05em;padding:0;border:1px solid transparent;border-radius:6px;background:transparent;color:inherit;text-align:center;font:inherit;line-height:1.15;vertical-align:middle;outline:none;}
.emoji-input:focus{border-color:#b98793;background:rgba(255,255,255,.72);box-shadow:0 0 0 2px rgba(214,164,177,.18);}
.doodle .emoji-input{width:.95em;min-width:.95em;max-width:.95em;}
@media(max-width:600px){
 .toolbar-wrap{padding:8px 10px;}
 .toolbar{gap:7px;}
 .brand{width:100%;margin-inline-end:0;margin-bottom:1px;font-size:14px;}
 .tool-button{flex:1;min-width:calc(50% - 5px);padding:9px 7px;font-size:12px;min-height:40px;}
 .save-state{width:100%;text-align:center;}
 .helper{margin:7px auto 10px;font-size:11px;}
}
@media print{.row-controls{display:none!important;}}
@media print{
 @page{size:225mm 240mm;margin:0}
 html,body{width:225mm!important;height:240mm!important;min-height:240mm!important;margin:0!important;padding:0!important;background:var(--paper)!important;overflow:hidden!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
 .toolbar-wrap,.helper{display:none!important}
 #poster-wrap{display:block!important;width:225mm!important;height:240mm!important;min-height:240mm!important;padding:0!important;margin:0!important;overflow:hidden!important;break-after:avoid-page!important;page-break-after:avoid!important;}
 /* Use layout-aware zoom instead of transform: transforms do not reduce the element's
    pagination box, so print engines may cut the poster midway onto a second page. */
 .poster{display:block!important;width:1200px!important;max-width:none!important;height:1280px!important;min-height:1280px!important;margin:0!important;padding:0 0 12px!important;border-radius:0!important;box-shadow:none!important;zoom:.7083333333!important;transform:none!important;transform-origin:top left;overflow:hidden!important;break-inside:avoid-page!important;page-break-inside:avoid!important;}
 .hero{height:150px!important;grid-template-columns:1fr 2fr 1fr!important;padding:9px 24px 5px!important;}
 .hero-note{font-size:19px!important}.hero-quote{font-size:21px!important}.hero-title .field{font-size:48px!important}.hero-subtitle{font-size:20px!important}.doodle{display:block!important;font-size:42px!important;}
 .poster-grid{grid-template-columns:minmax(0,2.48fr) minmax(300px,1fr)!important;gap:14px!important;padding:0 19px!important;}
 .schedule-header,.schedule-row{grid-template-columns:1.15fr 1fr .56fr!important;grid-template-areas:"details activity time"!important;gap:7px!important;}
 .schedule-header{display:grid!important}.schedule-list{gap:5px!important}.schedule-row{min-height:49px!important;padding:0!important;border:0!important;background:transparent!important;}
 .schedule-row .cell{border:1px solid rgba(177,145,140,.37)!important;border-radius:12px!important;padding:6px 9px!important;}
 .details-cell .field{font-size:16px!important;min-height:34px!important}.activity-cell,.activity-cell .field{font-size:18px!important}.activity-icon{font-size:26px!important}.time-cell .field{font-size:17px!important;}
 .sidebar{display:flex!important;flex-direction:column!important;gap:11px!important}.side-card{padding:12px 13px 11px!important;border-radius:17px!important}.side-title{font-size:23px!important}.footer{margin:9px 19px 0!important;display:flex!important;font-size:16px!important}.footer-item .field{font-size:16px!important;}
 input,textarea{color:#292126!important;opacity:1!important;-webkit-text-fill-color:#292126!important;}
}
</style>
</head>
<body>
<div class="toolbar-wrap">
 <div class="toolbar">
  <div class="brand">🌷 <span>جدولي اليومي — مساحة صغيرة لتنظيم يومك</span></div>
  <button class="tool-button primary" id="download-image">تنزيل صورة PNG</button>
  <button class="tool-button" id="reset">استعادة الجدول الأصلي</button>
  <span class="save-state" id="save-state" role="status" aria-live="polite">يُحفظ التعديل تلقائيًا</span>
 </div>
</div>
<div class="helper">اضغطي على أي نص أو وقت أو رمز تعبيري لتعديله مباشرةً. استخدمي السهمين ↑ ↓ بجانب كل نشاط لتغيير ترتيبه. التغييرات تُحفظ تلقائيًا على هذا الجهاز. يمكنك تنزيل الجدول كصورة PNG.</div>
<div id="poster-wrap"><main class="poster" id="poster" aria-label="الجدول اليومي القابل للتعديل"></main></div>
<script>
const STORAGE_KEY='jadwali-daily-planner-v1';
const defaults={
 title:'جدولي اليومي',
 leftNote:'خطوة صغيرة كل يوم تصنع فرقًا كبيرًا في مستقبلي',
 quote:'بسم الله نبدأ...',
 subtitle:'♥ تنظيم .. عبادة .. تطوير .. نجاح ♥',
 icons:{prayer:'🕌',reels:'🎬',chores:'🏠',goals:'🎯'},
 doodles:['♡','☕','📚'],
 headers:{details:'التفاصيل',activities:'الأنشطة',time:'الوقت'},
 schedule:[
  {time:'04:30 – 05:00',activity:'الاستيقاظ + صلاة الفجر',icon:'🕌',details:'الاستيقاظ، الوضوء، صلاة الفجر ثم أذكار الصباح الخفيفة.',color:'#f9e8e8'},
  {time:'05:00 – 05:30',activity:'الورد القرآني',icon:'📕',details:'قراءة وردك اليومي من القرآن (مثل: نصف حزب أو حسب العادة).',color:'#f6e2e7'},
  {time:'05:30 – 06:00',activity:'الراحة والنوم',icon:'🛏️',details:'نوم إضافي بعد الفجر (حتى 8:30 أو 9:00).',color:'#f5e4e6'},
  {time:'08:30 – 09:00',activity:'الاستيقاظ + صلاة الضحى',icon:'☀️',details:'الاستعداد لليوم، غسل الوجه، صلاة الضحى (إن أمكن).',color:'#f8edda'},
  {time:'10:00 – 10:00',activity:'تنظيم المنزل',icon:'🏠',details:'ترتيب الغرف، تنظيف خفيف، غسل الأواني أو أي مهام عاجلة.',color:'#f8eddc'},
  {time:'10:45 – 10:00',activity:'تحضير وطبخ الغداء',icon:'🍲',details:'تحضير وجبة الغداء، ترتيب المطبخ.',color:'#e8efe0'},
  {time:'10:45 – 11:30',activity:'الراحة + وقت شخصي',icon:'☕',details:'قهوة / شاي، استرخاء، تصفح هادئ.',color:'#e4efdf'},
  {time:'11:00 – 13:00',activity:'دراسة اللغة الإنجليزية',icon:'🔠',details:'قواعد، مفردات، استماع أو محادثة. (يمكن تقسيم الوقت حسب مستواك).',color:'#e2eef9'},
  {time:'13:00 – 14:00',activity:'صلاة الظهر + أذكار',icon:'🕌',details:'ثم الغداء والراحة القصيرة.',color:'#e6e9fb'},
  {time:'14:00 – 15:30',activity:'الرسم الرقمي',icon:'🖊️',details:'تعلم الأدوات، تطبيقات الرسم، تطبيق مشاريع صغيرة.',color:'#efdef7'},
  {time:'15:30 – 17:00',activity:'المشروع ديالي (Aylita Touch)',icon:'💻',details:'تجهيز الطلبات (إن وجدت) أو العمل على السوشيوريات والفيديوهات (تحضير الريلزات الاثنين / الأربعاء / الجمعة).',color:'#f4dfef'},
  {time:'17:00 – 17:30',activity:'راحة + فطور خفيف',icon:'🧁',details:'وقت لنفسك، شوية طاقة قبل ما نكمل.',color:'#f8e8dc'},
  {time:'17:30 – 18:30',activity:'صلاة العصر + أذكار',icon:'🕌',details:'ثم متابعة العمل أو إنجاز مهام أخرى.',color:'#f8e9da'},
  {time:'18:30 – 20:00',activity:'تحضير العشاء + العشاء',icon:'🍲',details:'طبخ العشاء، ترتيب المطبخ.',color:'#e1efee'},
  {time:'20:00 – 21:00',activity:'وقت عائلي / شخصي',icon:'♥',details:'الاسترخاء، مشاهدة شيء مفيد، أو قراءة كتاب.',color:'#e6efe3'},
  {time:'21:00 – 22:00',activity:'صلاة العشاء + أذكار',icon:'🕌',details:'ثم التحضير للنوم (غسل الوجه، عناية بسيطة).',color:'#eee0f5'},
  {time:'22:00 – 22:30',activity:'النوم',icon:'🌙',details:'نوم مريح لراحة أفضل غدًا بإذن الله.',color:'#e8def4'}
 ],
 prayerTitle:'أوقات الصلاة',
 prayers:[
  {time:'04:30 – 05:00',name:'الفجر',icon:'☀️'},
  {time:'13:00 – 13:30',name:'الظهر',icon:'☀️'},
  {time:'17:00 – 17:30',name:'العصر',icon:'☀️'},
  {time:'18:15 – 18:45',name:'المغرب',icon:'🌇'},
  {time:'20:30 – 20:30',name:'العشاء',icon:'🌙'}
 ],
 prayerNote:'♥ (قد تختلف الأوقات حسب منطقتك)',
 reelsTitle:'الريلزات الأسبوعية',
 reelsNote:'موعد النشر : الاثنين / الأربعاء / الجمعة (تحضّر لها يوم قبلها)',
 reels:[
  {text:'تصوير الفيديوهات',checked:false},
  {text:'تصميم المحتوى',checked:false},
  {text:'المونتاج / التعديلات',checked:false},
  {text:'النشر في الوقت المحدد',checked:false}
 ],
 choresTitle:'المهام المنزلية الأسبوعية',
 chores:[
  {text:'تنظيف الغرف والحمامات',checked:false},
  {text:'ترتيب الملابس والخزائن',checked:false},
  {text:'غسيل الملابس',checked:false},
  {text:'تنظيف المطبخ',checked:false},
  {text:'تنظيم الأدوات والأغراض',checked:false}
 ],
 goalsTitle:'أهدافي',
 goals:[
  {text:'الالتزام بالصلوات في وقتها',checked:false},
  {text:'الاستمرار في الورد القرآني',checked:false},
  {text:'تطوير مهاراتي في الإنجليزية والرسم',checked:false},
  {text:'نجاح مشروعي Aylita Touch',checked:false},
  {text:'الاهتمام بصحتي وراحتي النفسية',checked:false},
  {text:'الاستمتاع بحياتي خطوة بخطوة ♥',checked:false}
 ],
 endQuote:'لست مضطرة لأن أكون مثالية، يكفي أن أكون أفضل من نفسي بالأمس ♥',
 footer:[
  {text:'بإذن الله .. كل شيء سيكون بخير 🌸'},
  {text:'مهلة لكل شيء ♥'},
  {text:'كل يوم فرصة جديدة ♥'},
  {text:'أنا قادرة ✦'}
 ]
};
let data=clone(defaults);
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getSaved(){try{const x=localStorage.getItem(STORAGE_KEY);if(x){const parsed=JSON.parse(x);return mergeDefaults(clone(defaults),parsed)}}catch(e){}return clone(defaults)}
function mergeDefaults(base,custom){if(!custom||typeof custom!=='object')return base;for(const k of Object.keys(base)){if(Array.isArray(base[k])){if(Array.isArray(custom[k]))base[k]=base[k].map((v,i)=>{if(custom[k][i]===undefined)return v;if(v&&typeof v==='object'&&!Array.isArray(v))return mergeDefaults(v,custom[k][i]);return custom[k][i]})}else if(base[k]&&typeof base[k]==='object'){base[k]=mergeDefaults(base[k],custom[k])}else if(custom[k]!==undefined&&typeof custom[k]===typeof base[k])base[k]=custom[k]}return base}
function setPath(obj,path,val){const p=path.split('.');let at=obj;for(let i=0;i<p.length-1;i++)at=at[p[i]];at[p[p.length-1]]=val}
function field(path,value,cls='',label='') {return `<input class="field ${cls}" data-path="${esc(path)}" aria-label="${esc(label||String(value))}" value="${esc(value)}" autocomplete="off" spellcheck="false">`}
function emojiField(path,value,label='تعديل الرمز التعبيري') {return `<input type="text" class="emoji-input" data-path="${esc(path)}" aria-label="${esc(label)}" value="${esc(value)}" maxlength="8" autocomplete="off" spellcheck="false">`}
function detailField(path,value){return `<textarea class="field" data-path="${esc(path)}" aria-label="${esc(value)}" rows="2" spellcheck="false">${esc(value)}</textarea>`}
function checklist(items,path,extra=''){return `<div class="check-list ${extra}">${items.map((it,i)=>`<label class="checkline ${it.checked?'done':''}"><input type="checkbox" data-checkpath="${path}.${i}.checked" ${it.checked?'checked':''} aria-label="إنجاز ${esc(it.text)}"><input class="field" data-path="${path}.${i}.text" aria-label="${esc(it.text)}" value="${esc(it.text)}" autocomplete="off"></label>`).join('')}</div>`}
function render(){
 const schedule=data.schedule.map((r,i)=>`<div class="schedule-row" style="--rowbg:${r.color||'#f8e7e8'}">

 </div>
 <footer class="footer">${data.footer.map((f,i)=>`<div class="footer-item">${field(`footer.${i}.text`,f.text,'',f.text)}</div>`).join('')}</footer>`;
 document.querySelectorAll('.checkline input[type="checkbox"]').forEach(el=>el.addEventListener('change',e=>{setPath(data,e.target.dataset.checkpath,e.target.checked);e.target.closest('.checkline').classList.toggle('done',e.target.checked);save();}));

document.getElementById('poster').addEventListener('click',e=>{const button=e.target.closest('[data-move]');if(!button)return;const from=Number(button.dataset.index);const to=from+(button.dataset.move==='up'?-1:1);if(!Number.isInteger(from)||to<0||to>=data.schedule.length)return;[data.schedule[from],data.schedule[to]]=[data.schedule[to],data.schedule[from]];render();save();});
function fitTextarea(el){el.style.height='auto';const base=window.matchMedia('(max-width:600px)').matches?19:22;el.style.height=Math.max(base,Math.min(el.scrollHeight,72))+'px'}
let saveTimer;
function updatePosterScale(){const poster=document.getElementById('poster');const wrap=document.getElementById('poster-wrap');if(!poster||!wrap)return;const available=Math.max(240,wrap.clientWidth-8);const scale=Math.min(1,available/1200);poster.style.setProperty('--poster-scale',String(scale));}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));const s=document.getElementById('save-state');s.textContent='تم الحفظ تلقائيًا ✓';clearTimeout(saveTimer);saveTimer=setTimeout(()=>s.textContent='تُحفظ التعديلات على هذا الجهاز',1800)}catch(e){document.getElementById('save-state').textContent='تعذر الحفظ محليًا'}}
document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-path]')){setPath(data,el.dataset.path,el.value);save();}});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('هل تريدين استعادة النصوص والأوقات الافتراضية؟ سيُستبدل الجدول الحالي.')){data=clone(defaults);try{localStorage.removeItem(STORAGE_KEY)}catch(e){}render();save();window.scrollTo({top:0,behavior:'smooth'})}});
function clonePosterForExport(){
 const source=document.getElementById('poster');const copy=source.cloneNode(true);copy.classList.add('export-mode');copy.removeAttribute('id');
 copy.querySelectorAll('.row-controls').forEach(el=>el.remove());
 copy.querySelectorAll('input.emoji-input').forEach(input=>{const span=document.createElement('span');span.className=input.closest('.activity-cell,.prayer-name')?'activity-icon':'emoji-display';span.textContent=input.value;input.replaceWith(span)});
 copy.querySelectorAll('input.field').forEach(input=>{const span=document.createElement('span');span.className=input.className+' field-display';span.textContent=input.value;span.setAttribute('aria-label',input.getAttribute('aria-label')||'');input.replaceWith(span)});
 copy.querySelectorAll('textarea.field').forEach(input=>{const span=document.createElement('span');span.className=input.className+' field-display';span.textContent=input.value;input.replaceWith(span)});
 copy.querySelectorAll('input[type="checkbox"]').forEach(input=>{const span=document.createElement('span');span.className='export-check';span.textContent=input.checked?'☑':'☐';input.replaceWith(span)});
 copy.style.width='1200px';copy.style.height='1280px';copy.style.minHeight='1280px';copy.style.maxWidth='none';copy.style.margin='0';copy.style.marginBottom='0';copy.style.borderRadius='0';copy.style.boxShadow='none';copy.style.overflow='hidden';copy.style.transform='none';copy.style.setProperty('--poster-scale','1');
 return copy;
}

async function loadHtml2Canvas(){
 if(window.html2canvas)return window.html2canvas;
 await new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
  script.onload=resolve;
  script.onerror=()=>reject(new Error('تعذر تحميل أداة إنشاء الصور. تحققي من اتصال الإنترنت ثم حاولي مرة أخرى.'));
  document.head.appendChild(script);
 });
 if(!window.html2canvas)throw new Error('لم يتم تحميل أداة إنشاء الصور.');
 return window.html2canvas;
}
async function downloadPNG(){
 const btn=document.getElementById('download-image');const old=btn.textContent;btn.disabled=true;btn.textContent='جارٍ تجهيز الصورة…';
 let holder=null;
 try{
  const renderCanvas=await loadHtml2Canvas();
  const copy=clonePosterForExport();
  holder=document.createElement('div');
  holder.setAttribute('aria-hidden','true');
  holder.style.cssText='position:fixed;left:0;top:0;width:1200px;height:1280px;overflow:hidden;z-index:-1;pointer-events:none;background:#fff8f2;direction:rtl;';
  holder.appendChild(copy);
  document.body.appendChild(holder);
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const canvas=await renderCanvas(copy,{
   backgroundColor:'#fff8f2',
   scale:2,
   width:1200,
   height:1280,
   windowWidth:1200,
   windowHeight:1280,
   scrollX:0,
   scrollY:0,
   useCORS:true,
   allowTaint:false,
   logging:false
  });
  if(!canvas||canvas.width<1200||canvas.height<1280)throw new Error('حجم الصورة الناتجة غير صحيح.');
  const png=await new Promise((resolve,reject)=>canvas.toBlob(blob=>{
   if(!blob||blob.type!=='image/png'||blob.size<5000){reject(new Error('لم يتم إنشاء صورة PNG صالحة.'));return;}
   resolve(blob);
  },'image/png'));
  const url=URL.createObjectURL(png);
  const link=document.createElement('a');link.href=url;link.download='jadwali-al-yawmi.png';document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  document.getElementById('save-state').textContent='تم تنزيل صورة PNG ✓';
 }catch(err){
  alert('تعذر إنشاء صورة PNG. لم يتم تنزيل ملف فارغ.\n'+(err&&err.message?err.message:'يرجى المحاولة مرة أخرى.'));
 }finally{
  if(holder)holder.remove();
  btn.disabled=false;btn.textContent=old;
 }
}
document.getElementById('download-image').addEventListener('click',downloadPNG);
data=getSaved();render();updatePosterScale();window.addEventListener('resize',updatePosterScale,{passive:true});window.addEventListener('orientationchange',updatePosterScale);
